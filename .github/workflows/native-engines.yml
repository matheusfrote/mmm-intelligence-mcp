name: Native engines and R coverage
on:
  workflow_call:
    inputs:
      scientific_extensive:
        type: boolean
        default: false
      scientific_draws:
        type: number
        default: 1000
      scientific_replications:
        type: number
        default: 100
      recovery_backend:
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: ${{ (inputs.scientific_extensive || inputs.recovery_backend != '') && 360 || 120 }}
    env:
      MMM_TEST_NATIVE: '1'
      MMM_MAX_FILE_BYTES: '52428800'
      MMM_BACKEND_TIMEOUT_SECONDS: '1800'
      COVERAGE_FILE: var/coverage/native-parent/.coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/base-ci.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install the three isolated pinned Python runtimes
        shell: pwsh
        run: |
          foreach ($runtimeName in @('meridian','pymc','robyn')) {
            python -m venv "var/envs/$runtimeName"
            $lock = if ($runtimeName -eq 'robyn') {'robyn-python'} else {$runtimeName}
            & "var/envs/$runtimeName/Scripts/python.exe" -m pip install -r "requirements/$lock-win-py312.txt" 'coverage==7.17.0'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "var/envs/$runtimeName/Scripts/python.exe" -m pip check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native Meridian sampler option contract without sampling
        shell: pwsh
        run: |
          & ./var/envs/meridian/Scripts/python.exe -c "import sys; sys.path.insert(0,'src'); from mmm_intelligence.integrations.native_scientific import meridian_sampler_options; x=meridian_sampler_options({'target_accept':0.97}); hash(x['dual_averaging_kwargs']); assert x['dual_averaging_kwargs']['target_accept_prob']==0.97; assert x['max_tree_depth']==8; assert meridian_sampler_options({})['dual_averaging_kwargs']['target_accept_prob']==0.85"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the verified portable R distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory var/runtime -Force | Out-Null
          Invoke-WebRequest https://cdn.posit.co/r/windows/R-4.5.2-windows.zip -OutFile var/runtime/R.zip
          if ((Get-FileHash var/runtime/R.zip -Algorithm SHA256).Hash -ne '9736BD668F547394AAD32E51798273CAF76CF12C3457BD3763F396CF4E05DBE9') { throw 'R archive checksum mismatch' }
          Expand-Archive var/runtime/R.zip var/runtime/r-portable
          python examples/install_r_binaries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real preparation, train, restore, scenario and supported forecast
        shell: pwsh
        run: |
          New-Item -ItemType Directory var/coverage/native-parent -Force | Out-Null
          python -m coverage run -m pytest tests/test_native_cycles.py -q -s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/coverage_gate.py record --directory var/coverage/native-parent --label native-parent
      - name: All45 MCP tools, resource and prompts through official stdio client
        run: python examples/operational_workflow.py --native --output-dir evidence/native-operational-ci
      - name: R executable expression and decision/loop branch gates
        shell: pwsh
        run: |
          & ./var/runtime/r-portable/R-4.5.2/bin/Rscript.exe --vanilla examples/r_worker_coverage.R $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./var/runtime/r-portable/R-4.5.2/bin/Rscript.exe --vanilla examples/r_worker_branches.R $PWD.Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-native
          include-hidden-files: true
          if-no-files-found: error
          path: |
            var/coverage/native-parent/
            var/coverage/native/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r-coverage
          if-no-files-found: error
          path: |
            evidence/r-worker-coverage/coverage.json
            evidence/r-worker-branches/coverage.json
          retention-days: 14
    # Synthetic local processes only; never publishes or deploys a service.
      - name: Extensive scientific execution; inspect statistical and causal outcomes separately
        if: inputs.scientific_extensive
        shell: pwsh
        env:
          SCIENTIFIC_DRAWS: ${{ inputs.scientific_draws }}
          SCIENTIFIC_REPLICATIONS: ${{ inputs.scientific_replications }}
        run: |
          python examples/scientific_protocol.py --backend all --draws $env:SCIENTIFIC_DRAWS --tune $env:SCIENTIFIC_DRAWS --replications $env:SCIENTIFIC_REPLICATIONS --output-dir evidence/scientific-extensive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Execution completed. Scientific failures and inconclusive outcomes are preserved in result.json; workflow success is not scientific approval.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && inputs.scientific_extensive }}
        with:
          name: scientific-outcomes
          if-no-files-found: error
          path: |
            evidence/scientific-extensive/result.json
            evidence/scientific-extensive/partial.json
            evidence/scientific-extensive/*.md
          retention-days: 30
      - name: Known-truth native recovery with full sampling/search budgets
        if: inputs.recovery_backend != ''
        shell: pwsh
        env:
          RECOVERY_BACKEND: ${{ inputs.recovery_backend }}
        run: |
          python examples/scientific_protocol.py --backend $env:RECOVERY_BACKEND --native-replications 2 --skip-refits --output-dir evidence/native-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'Small synthetic recovery study; inspect statistical outcomes. Not a coverage or causal certification.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && inputs.recovery_backend != '' }}
        with:
          name: native-recovery-${{ inputs.recovery_backend }}
          if-no-files-found: error
          path: |
            evidence/native-recovery/result.json
            evidence/native-recovery/partial.json
            evidence/native-recovery/*.md
          retention-days: 30
