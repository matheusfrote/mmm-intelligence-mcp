name: Local package quality
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COVERAGE_FILE: var/coverage/base/.coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/base-ci.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests examples server.py
      - run: python -m ruff format --check src tests examples server.py
      - run: python -m mypy src
      - run: python -m bandit -r src
      - run: python examples/check_secrets.py
      - run: python -c "from pathlib import Path; Path('var/coverage/base').mkdir(parents=True, exist_ok=True)"
      - run: python -m coverage run -m pytest -q
      - run: python examples/coverage_gate.py record --directory var/coverage/base --label base-${{ matrix.os }}-${{ matrix.python }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: var/coverage/base/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: python -m build --no-isolation
      - run: python examples/verify_wheel.py --wheel-dir dist
      - run: python examples/mcp_workflow.py --extended --data-dir var/ci-demo --output-dir evidence/ci-demo
      - run: python examples/http_smoke.py --output-dir evidence/ci-http
      - run: python examples/scientific_stress.py --output-dir evidence/ci-scientific-stress
      - run: python examples/closure_workflow.py --output-dir evidence/ci-integral
  native:
    uses: ./.github/workflows/native-engines.yml
  coverage:
    needs: [test, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/base-ci.txt"
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: coverage-*
          path: var/coverage-downloads
      - name: Exact Python line and branch gate at identical source hashes
        run: python examples/coverage_ci_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-python-coverage
          path: evidence/python-coverage/
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/base-ci.txt"
      - run: python -m pip_audit --no-deps --disable-pip -r requirements/base-ci.txt
    # No upload, publish, deploy, credentials or real datasets.
